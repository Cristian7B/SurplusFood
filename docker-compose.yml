version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: foodbridge_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: foodbridge_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    container_name: foodbridge_backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    command: sh -c "npx prisma generate && npm run start:dev"

volumes:
  pgdata: